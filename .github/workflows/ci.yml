name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Database-backed tests run against this. The suite's global setup
      # creates the "<name>_test" database and applies every migration to it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobfinder
          JWT_SECRET: ci-only-secret
      - run: npm run build
        env:
          # Dummy values so a DB-less CI build can still validate the app compiles.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          JWT_SECRET: ci-only-secret
