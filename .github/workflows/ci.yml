name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
        env:
          # Dummy values so a DB-less CI build can still validate the app compiles.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          JWT_SECRET: ci-only-secret
