services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: jobfinder
      POSTGRES_DB: jobfinder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobfinder:jobfinder@db:5432/jobfinder?schema=public
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/data/uploads
    command: sh -c "npx prisma migrate deploy && npm run start"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobfinder:jobfinder@db:5432/jobfinder?schema=public
    volumes:
      - uploads:/app/data/uploads
    command: npm run worker

volumes:
  db_data:
  uploads:
